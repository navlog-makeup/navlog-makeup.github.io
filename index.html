<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7a8c4" />
  <meta name="description" content="Lens & mi hot 2026 · Na Vlog — chạm để mua trên Shopee" />
  <title>Na Vlog Lookbook · Hot 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #f28ab2;
      --blush: #ffc1d6;
      --petal: #ffe4ef;
      --cream: #fff7fa;
      --ink: #3a2433;
      --muted: #8a6a7a;
      --gold: #d4a574;
      --card: rgba(255,255,255,0.72);
      --border: rgba(255,255,255,0.85);
      --shadow: 0 16px 48px rgba(242, 138, 178, 0.22);
      --danger: #c9184a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      background:
        radial-gradient(900px 500px at 0% -10%, #ffd0e4 0%, transparent 55%),
        radial-gradient(700px 420px at 110% 15%, #ffe8c8 0%, transparent 50%),
        radial-gradient(600px 380px at 50% 110%, #ffc8dc 0%, transparent 55%),
        linear-gradient(168deg, #fff5f8 0%, #ffe9f1 45%, #ffdce8 100%);
      background-attachment: fixed;
      padding: 18px 14px 120px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 440px; margin: 0 auto; }

    .hero {
      text-align: center;
      padding: 22px 12px 8px;
      position: relative;
    }
    .lash-ornament {
      width: 72px; height: 36px; margin: 0 auto 10px;
      opacity: 0.85;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem; font-weight: 600; letter-spacing: 0.02em;
      background: linear-gradient(120deg, #c45c84, #f28ab2 45%, #d4a574);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline {
      margin-top: 6px; font-size: 0.86rem; color: var(--muted); font-weight: 500;
    }
    .pill-row {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
      margin-top: 14px;
    }
    .pill {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.65); border: 1px solid rgba(242,138,178,0.35);
      color: #a34e72;
    }

    .section-head {
      margin: 22px 4px 14px; text-align: center;
    }
    .section-head h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem; font-weight: 600; color: var(--ink);
    }
    .section-head p {
      margin-top: 6px; font-size: 0.88rem; color: var(--muted); line-height: 1.45;
    }

    .cards { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:active { transform: scale(0.99); }

    .card-media {
      position: relative;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #ffe8f0, #fff5f8);
      overflow: hidden;
    }
    .card-media img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .badge {
      position: absolute; top: 12px; left: 12px;
      background: rgba(255,255,255,0.92);
      color: #a34e72; font-size: 0.72rem; font-weight: 700;
      padding: 6px 10px; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(163,78,114,0.15);
    }
    .tag {
      position: absolute; top: 12px; right: 12px;
      background: linear-gradient(120deg, #f28ab2, #d4a574);
      color: #fff; font-size: 0.68rem; font-weight: 700;
      padding: 6px 10px; border-radius: 999px;
    }

    .card-body { padding: 16px 16px 18px; }
    .card-body h3 {
      font-size: 1.05rem; font-weight: 700; line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .card-body .sub {
      margin-top: 6px; font-size: 0.88rem; color: var(--muted); line-height: 1.45;
    }
    .bullets {
      list-style: none; margin: 12px 0 0; display: flex; flex-direction: column; gap: 7px;
    }
    .bullets li {
      font-size: 0.86rem; line-height: 1.4; padding-left: 22px; position: relative;
      color: #4a3040;
    }
    .bullets li::before {
      content: "✦"; position: absolute; left: 0; top: 0;
      color: var(--rose); font-size: 0.75rem;
    }

    .cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 16px; width: 100%;
      padding: 14px 16px; border: 0; border-radius: 999px;
      font: inherit; font-weight: 700; font-size: 0.95rem;
      color: #fff; text-decoration: none; cursor: pointer;
      background: linear-gradient(120deg, #f28ab2 0%, #e76f9a 50%, #d4a574 120%);
      box-shadow: 0 10px 28px rgba(231, 111, 154, 0.35);
      transition: filter .15s ease, transform .15s ease;
    }
    .cta:hover { filter: brightness(1.04); }
    .cta:active { transform: translateY(1px); }
    .cta svg { width: 18px; height: 18px; }

    .site-footer {
      text-align: center; margin-top: 28px; padding: 8px;
      font-size: 0.82rem; color: var(--muted);
    }

    /* edit chrome */
    .fab {
      position: fixed; right: 16px; bottom: 18px; z-index: 40;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .fab button {
      border: 0; border-radius: 999px; cursor: pointer; font: inherit;
      font-weight: 700; font-size: 0.82rem;
      padding: 12px 16px;
      background: rgba(255,255,255,0.92);
      color: #a34e72;
      box-shadow: 0 10px 30px rgba(163,78,114,0.22);
      border: 1px solid rgba(242,138,178,0.35);
    }
    .fab button.primary {
      background: linear-gradient(120deg, #f28ab2, #d4a574);
      color: #fff; border: 0;
    }
    body.editing .fab .edit-only { display: inline-flex; }
    .fab .edit-only { display: none; }

    .edit-bar {
      display: none;
      margin: 12px 0 0;
      background: rgba(255,255,255,0.8);
      border: 1px dashed rgba(242,138,178,0.55);
      border-radius: 16px; padding: 12px; gap: 8px;
      flex-direction: column;
    }
    body.editing .edit-bar { display: flex; }
    .edit-bar label {
      font-size: 0.72rem; font-weight: 700; color: #a34e72; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .edit-bar input, .edit-bar textarea {
      width: 100%; border: 1px solid rgba(242,138,178,0.35);
      border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 0.86rem;
      background: #fff; color: var(--ink);
    }
    .edit-bar textarea { min-height: 72px; resize: vertical; }
    .card-edit {
      display: none; padding: 0 16px 14px; flex-direction: column; gap: 8px;
    }
    body.editing .card-edit { display: flex; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(58,36,51,0.45);
      display: none; align-items: center; justify-content: center;
      z-index: 60; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(360px, 100%);
      background: #fff; border-radius: 20px; padding: 22px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .modal p { font-size: 0.86rem; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
    .modal input {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid rgba(242,138,178,0.4); font: inherit; font-size: 1.1rem;
      letter-spacing: 0.2em; text-align: center;
    }
    .modal .err { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; margin-top: 8px; }
    .modal .row { display: flex; gap: 8px; margin-top: 14px; }
    .modal .row button {
      flex: 1; border: 0; border-radius: 999px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
    }
    .modal .cancel { background: #f3e6eb; color: #6b4458; }
    .modal .ok { background: linear-gradient(120deg,#f28ab2,#d4a574); color: #fff; }

    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
      background: rgba(58,36,51,0.92); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 0.84rem; opacity: 0; pointer-events: none; transition: .25s ease; z-index: 70;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

const STORAGE_KEY = "win-navlog-lookbook-v1";
const PIN_SESSION = "win-lash-authed";

function clone(o){ return JSON.parse(JSON.stringify(o)); }

const state = {
  data: null,
  editing: false,
};

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // keep pin from default if missing
      if (!parsed.pin) parsed.pin = DEFAULT_DATA.pin;
      state.data = parsed;
      return;
    }
  } catch(e){}
  state.data = clone(DEFAULT_DATA);
}

function saveData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch(e){
    toast("Không lưu được trên thiết bị này");
  }
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function applyHeroEditQuiet(){
  if (!state.editing) return;
  const d = state.data;
  d.brand = document.getElementById("editBrand").value.trim() || d.brand;
  d.tagline = document.getElementById("editTagline").value;
  d.sectionTitle = document.getElementById("editSectionTitle").value.trim() || d.sectionTitle;
  d.sectionSub = document.getElementById("editSectionSub").value;
  d.footer = document.getElementById("editFooter").value;
  saveData();
}

function flushProductEdits(){
  if (!state.editing) return;
  document.querySelectorAll("[data-edit-product]").forEach(box => {
    const id = box.getAttribute("data-edit-product");
    const p = state.data.products.find(x => x.id === id);
    if (!p) return;
    p.name = box.querySelector("[data-f=name]").value.trim() || p.name;
    p.subtitle = box.querySelector("[data-f=subtitle]").value;
    p.badge = box.querySelector("[data-f=badge]").value.trim() || p.badge;
    p.tag = box.querySelector("[data-f=tag]").value.trim() || p.tag;
    p.link = box.querySelector("[data-f=link]").value.trim() || p.link;
    const bullets = box.querySelector("[data-f=bullets]").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (bullets.length) p.bullets = bullets;
  });
  saveData();
}

function render(){
  const d = state.data;
  document.body.classList.toggle("editing", state.editing);
  document.getElementById("brandText").textContent = d.brand;
  document.getElementById("taglineText").textContent = d.tagline;
  document.getElementById("sectionTitle").textContent = d.sectionTitle;
  document.getElementById("sectionSub").textContent = d.sectionSub;
  document.getElementById("footerText").textContent = d.footer;

  if (state.editing) {
    document.getElementById("editBrand").value = d.brand;
    document.getElementById("editTagline").value = d.tagline;
    document.getElementById("editSectionTitle").value = d.sectionTitle;
    document.getElementById("editSectionSub").value = d.sectionSub;
    document.getElementById("editFooter").value = d.footer;
  }

  const root = document.getElementById("cards");
  root.innerHTML = "";
  d.products.forEach((p, idx) => {
    const art = document.createElement("article");
    art.className = "card";
    art.innerHTML = `
      <div class="card-media">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="${idx ? "lazy" : "eager"}" />
        <span class="badge">${esc(p.badge || "")}</span>
        <span class="tag">${esc(p.tag || "")}</span>
      </div>
      <div class="card-body">
        <h3>${esc(p.name)}</h3>
        <p class="sub">${esc(p.subtitle)}</p>
        <ul class="bullets">${(p.bullets||[]).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        <a class="cta" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6 5 3H2"/></svg>
          Mua trên Shopee
        </a>
      </div>
      <div class="card-edit" data-edit-product="${esc(p.id)}">
        <label>Tên sản phẩm</label><input data-f="name" value="${esc(p.name)}" />
        <label>Mô tả ngắn</label><textarea data-f="subtitle">${esc(p.subtitle)}</textarea>
        <label>Bullet (mỗi dòng 1 ý)</label><textarea data-f="bullets">${esc((p.bullets||[]).join("\n"))}</textarea>
        <label>Badge</label><input data-f="badge" value="${esc(p.badge||"")}" />
        <label>Tag</label><input data-f="tag" value="${esc(p.tag||"")}" />
        <label>Link Shopee</label><input data-f="link" value="${esc(p.link)}" />
      </div>`;
    root.appendChild(art);
  });

  document.getElementById("btnEdit").textContent = state.editing ? "Đang sửa…" : "Chỉnh sửa";
}

function openPinModal(){
  document.getElementById("pinModal").classList.add("open");
  document.getElementById("pinErr").textContent = "";
  const inp = document.getElementById("pinInput");
  inp.value = "";
  setTimeout(() => inp.focus(), 50);
}
function closePinModal(){ document.getElementById("pinModal").classList.remove("open"); }

function tryEnterEdit(){
  if (sessionStorage.getItem(PIN_SESSION) === "1") {
    state.editing = true; render(); toast("Đã vào chế độ chỉnh sửa"); return;
  }
  openPinModal();
}

function checkPin(){
  const val = document.getElementById("pinInput").value.trim();
  const expected = (state.data.pin || DEFAULT_DATA.pin || "");
  if (val && val === expected) {
    sessionStorage.setItem(PIN_SESSION, "1");
    closePinModal();
    state.editing = true;
    render();
    toast("Đã vào chế độ chỉnh sửa");
  } else {
    document.getElementById("pinErr").textContent = "Sai PIN — thử lại nhé";
  }
}

function exitEdit(){
  applyHeroEditQuiet();
  flushProductEdits();
  state.editing = false;
  render();
  toast("Đã thoát chỉnh sửa");
}

function resetData(){
  if (!confirm("Xoá chỉnh sửa trên máy này và về bản gốc?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state.data = clone(DEFAULT_DATA);
  render();
  toast("Đã reset về mặc định");
}

async function exportHtml(){
  applyHeroEditQuiet();
  flushProductEdits();
  // Bake current data into DEFAULT_DATA for the exported file
  let src = "";
  try {
    const res = await fetch(location.href);
    src = await res.text();
  } catch(e) {
    toast("Không lấy được mã nguồn — mở qua link ship.page rồi xuất");
    alert("Không xuất được từ chế độ file://.\n\nCách làm: mở đúng link ship.page → Chỉnh sửa → Xuất file HTML.\nHoặc bấm OK để sao chép JSON data.");
    try {
      await navigator.clipboard.writeText(JSON.stringify(state.data, null, 2));
      toast("Đã copy JSON data");
    } catch(_){}
    return;
  }
  const baked = "const DEFAULT_DATA = " + JSON.stringify(state.data, null, 2) + ";";
  const out = src.replace(/const DEFAULT_DATA = [\s\S]*?;\s*\/\*__END_DEFAULT_DATA__\*\//, baked + "\n/*__END_DEFAULT_DATA__*/");
  const blob = new Blob([out], {type: "text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "linkbio-mi.html";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Đã xuất file HTML");
}

document.getElementById("btnEdit").addEventListener("click", () => {
  if (state.editing) { exitEdit(); return; }
  tryEnterEdit();
});
document.getElementById("btnExitEdit").addEventListener("click", exitEdit);
document.getElementById("btnReset").addEventListener("click", resetData);
document.getElementById("btnExport").addEventListener("click", exportHtml);
document.getElementById("pinCancel").addEventListener("click", closePinModal);
document.getElementById("pinOk").addEventListener("click", checkPin);
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") checkPin(); });

// autosave edits
document.addEventListener("change", e => {
  if (!state.editing) return;
  if (e.target.closest("#heroEdit") || e.target.closest("[data-edit-product]")) {
    applyHeroEditQuiet();
    flushProductEdits();
  }
});

loadData();
if (sessionStorage.getItem(PIN_SESSION) === "1") state.editing = false; // require explicit click
render();
  </script>
</body>
</html>
